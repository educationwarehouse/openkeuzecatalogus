cache_timeout: null
catalog: backend
schema: public
sql: "select \n  --product_ed.id, \n  --product_ed.effdt, \n  --product_ed.effstatus,\n\
  \  --product_ed.gid, \n  --product_ed.isbn, \n  --product_ed.name, \n  --product_ed.method_gid,\
  \ \n  --product_ed.supplier_gid, \n  product_supplier.name as supplier_name, \n\
  \  importer_supplier.name as importer_supplier_name,  \n  product_ed.supplier_gid\
  \ = importer_run.supplier_gid as zelfde_lev, \n  product_ed.*\n  from product_ed\n\
  \  -- join producten_ed aan importer runs om de producten per run te kunnen achterhalen\n\
  \  -- dit kan op basis van de started_at en updated_at omdat dit binnen dezelfde\
  \ commit gerelateerd zijn, de effdt wordt 'direct' bijgewerkt en is de actuele klok,\
  \ en daarom niet bruikbaar. \n  inner join importer_run on importer_run.started_at\
  \ = product_ed.updated_at -- and product_ed.supplier_gid = importer_run.supplier_gid\n\
  \  -- we willen supplier_name erbij hebben tbv de extra gegevens. \n  left outer\
  \ join supplier_model  as product_supplier on  product_supplier.gid = product_ed.supplier_gid\
  \ \n  left outer join supplier_model  as importer_supplier on  importer_supplier.gid\
  \ = importer_run.supplier_gid \n"
