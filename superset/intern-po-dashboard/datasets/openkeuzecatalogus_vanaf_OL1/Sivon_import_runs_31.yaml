catalog: backend
schema: public
sql: "SELECT\n    ir.id as importer_run_id,\n    coalesce(last_run.id = ir.id, false)\
  \ as is_last_run,\n    ir.started_at,\n    ir.success,\n    ir.failure_message,\n\
  \    ir.supplier_name,\n    ir.source,\n    ir.duration_ms,\n    ir.supplier_gid,\n\
  \    ir.gid as importer_run_gid, \n    jsonb_array_length(\n        COALESCE(ir.warnings_json::jsonb,\
  \ '[]'::jsonb)\n    ) AS aantal_warnings\nFROM importer_run ir \n  full outer join\
  \ (select max(id) as id, supplier_gid from importer_run group by supplier_gid)as\
  \ last_run on ir.id = last_run.id and ir.supplier_gid = last_run.supplier_gid\n\
  GROUP BY\n    ir.id,\n    last_run.id, \n    ir.started_at,\n    ir.success,\n \
  \   ir.supplier_name,\n    ir.source,\n    ir.duration_ms\n"
