schema: public
sql: "\nSELECT\n    min(ts) as 'min_ts'\n  , max(ts) as 'max_ts'\n  , count(*) as\
  \ 'Aantal x gezocht'\n  , entity_kind as 'Gezocht naar'\n  , original_query as 'Invoer\
  \ zoekveld'\n  , active_filters::jsonb as 'Volledige filters'\n  , max(result_count)\
  \ as '# resultaten/#paginas'\n  , IF max(result_count) > 0 THEN min(current_page)||'..'||max(current_page)||'/'||max(total_pages)\
  \ else '-' END  as \"van..tot/totaal\"\n  , session_gid as \"sessie\"\n  , bool_or(is_logged_in)\
  \ as \"is ingelogd\"\n from catalog_search_report_v1 \ngroup by entity_kind, active_filters::jsonb,\
  \ original_query, session_gid"
