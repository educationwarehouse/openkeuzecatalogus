sql: "SELECT\n   IF fix_url <> '#' THEN '<a href=\"'||fix_url||'\" target=\"_blank\"\
  >Locatie zonder organisatie</a>' else 'Locatie zonder organisatie' END\n  , location_gid\n\
  \  , location_name \n  , brin\n  , vestigingscode\n  , city\nFROM locations_without_organisation_mapping_report_v1\n\
  UNION ALL\nSELECT\n     IF fix_url <> '#' THEN '<a href=\"'||fix_url||'\" target=\"\
  _blank\">Locatie zonder brin vestiging</a>' ELSE 'Locatie zonder brin vestiging'\
  \ END\n  , location_gid\n  , location_name \n  , brin\n  , vestigingscode\n  , city\n\
  FROM locations_without_brin_vest_code_report_v1\nUNION ALL\nSELECT\n     IF fix_url\
  \ <> '#' THEN '<a href=\"'||fix_url||'\" target=\"_blank\">School zonder homepage</a>'\
  \ ELSE 'School zonder homepage' END\n  , school_gid \n  , school_name \n  , brin\
  \ \n  , null as vestigingscode\n  , city \nFROM schools_without_homepage_url_report_v1\n\
  UNION ALL\nSELECT\n     IF fix_url <> '#' THEN '<a href=\"'||fix_url||'\" target=\"\
  _blank\">School zonder email domein</a>' ELSE 'School zonder email domein' END\n\
  \  , school_gid \n  , school_name \n  , brin \n  , null as vestigingscode\n  , city\
  \ \nFROM schools_without_email_domain_report_v1"
