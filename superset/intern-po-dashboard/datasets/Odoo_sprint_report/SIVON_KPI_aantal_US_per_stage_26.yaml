sql: "--select * from sprint_status\n--select stage_name, count(*) from sprint_status\
  \ group by stage_name\n\n\nSELECT\n-- select 0 as voortgang_in_userstories, \n--\
  \       0 as planning_in_userstories, \n--       0 as doorlooptijd_wijzigingen_in_dagen\n\
  --       -- Roadmap en wijzigingsbeheer: voortgang vs planning, doorlooptijd wijzigingen\n\
  \n\n  -- select sprint, state, count(distinct task_id) \n  --   from sprint_status\n\
  \  --   group by sprint, state\n  \n-- SELECT\n--   sprint,\n--   COUNT(DISTINCT\
  \ CASE WHEN state = '04_waiting_normal'    THEN task_id END) AS inbox,\n--   COUNT(DISTINCT\
  \ CASE WHEN state = '01_in_progress'       THEN task_id END) AS onder_handen,\n\
  --   COUNT(DISTINCT CASE WHEN state = '02_changes_requested' THEN task_id END) AS\
  \ wijzigingen_gevraagd,\n--   COUNT(DISTINCT CASE WHEN state = '03_approved'   \
  \       THEN task_id END) AS goedgekeurd,\n-- --  COUNT(DISTINCT CASE WHEN state\
  \ = '1_canceled'           THEN task_id END) AS geannuleerd,\n--   COUNT(DISTINCT\
  \ CASE WHEN state = '1_done'               THEN task_id END) AS klaar\n-- FROM sprint_status\n\
  -- where sprint >0\n-- GROUP BY sprint\n-- ORDER BY sprint;\n\n  sprint,\n  COUNT(DISTINCT\
  \ CASE WHEN stage_name = 'Product backlog'                  THEN task_id END) AS\
  \ product_backlog,\n  COUNT(DISTINCT CASE WHEN stage_name = 'Ready (DoR OK)'   \
  \                THEN task_id END) AS ready_dor_ok,\n  COUNT(DISTINCT CASE WHEN\
  \ stage_name = 'In Sprint'                        THEN task_id END) AS in_sprint,\n\
  \  COUNT(DISTINCT CASE WHEN stage_name = 'In review'                        THEN\
  \ task_id END) AS in_review,\n  COUNT(DISTINCT CASE WHEN stage_name = 'Ter acceptatie\
  \ (interne review)'  THEN task_id END) AS acceptatie_intern,\n  COUNT(DISTINCT CASE\
  \ WHEN stage_name = 'Ter acceptatie PO'                THEN task_id END) AS acceptatie_po,\n\
  \  COUNT(DISTINCT CASE WHEN state in ('1_done')                      THEN task_id\
  \ END) AS goedgekeurd\nFROM sprint_status\nWHERE sprint > 0 \n  and epic_name is\
  \ not null \n  and epic_name is not ''\n  and state in ('1_done','03_approved','02_changes_requested','01_in_progress','04_waiting_normal')\n\
  GROUP BY sprint\nORDER BY sprint;"
