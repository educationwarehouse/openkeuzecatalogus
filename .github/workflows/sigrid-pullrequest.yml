name: Sigrid pull request feedback

on:
  pull_request:
    branches:
      - 'openkeuzecatalogus/staging'

jobs:
  sigridci:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@main
        with:
          customer: sivon
          system: ew-okl
          capability: maintainability,osh,security
          detaillevel: full
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
          SIGRIDCI_GITHUB_COMMENT_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
