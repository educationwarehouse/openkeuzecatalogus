x-security-hardening: &security-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-memory-limit: &memory-limit
  mem_limit: 5g

networks:
  broker:
    name: broker
    external: true
  backend:
    name: ${PROJECT}_backend

services:
  migrate:
    restart: "no"
    build:
      context: migrate
      args:
        PIP_INDEX_URL: https://devpi.edwh.nl/root/pypi/+simple/
    depends_on:
      - pg-0
      - redis-master
    extra_hosts:
      host.docker.internal: host-gateway
    <<: [*security-hardening, *memory-limit]
    environment: &shared_environment
      PROJECT: ${PROJECT}
      PYTHONIOENCODING: "UTF-8"
      HOSTINGDOMAIN: ${HOSTINGDOMAIN}
      PY4WEB_SUBDOMAIN: ${PY4WEB_SUBDOMAIN}
      STATE_OF_DEVELOPMENT: ${STATE_OF_DEVELOPMENT:-ONT}
      REDIS_MASTER_HOST: redis-master
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run edwh setup to configure REDIS_PASSWORD}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-604800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-2592000}
      SIGNED_URL_SECONDS: ${SIGNED_URL_SECONDS:-604800}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      LLM_FIELD_MAX_CHARS: ${LLM_FIELD_MAX_CHARS:-20000}
      LLM_CALL_MAX_CHARS: ${LLM_CALL_MAX_CHARS:-100000}
      REDIS_SLAVE_HOST: redis-slave
      INSIDE_DOCKER_POSTGRES_URI: ${INSIDE_DOCKER_POSTGRES_URI}
      POSTGRES_URI: ${INSIDE_DOCKER_POSTGRES_URI}
      MIGRATE_URI: ${INSIDE_DOCKER_POSTGRES_URI}
      SCHEMA_VERSION: ${SCHEMA_VERSION}
      DB_FOLDER: "/tmp"
      USE_TYPEDAL: 1
      TYPEDAL_CACHING: 0
      # asked by `edwh setup` (see tasks.py). SCHEMA_VERSION above doubles as
      # the cache build id, so no separate variable for it.
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_CACHE_HOST: redis-master
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      ROUTE_STATS: ${ROUTE_STATS:-none}
      ROUTE_STATS_SLOW_MS: ${ROUTE_STATS_SLOW_MS:-500}
      PYTHONPATH: /pythonpath
      EMAIL_VERIFICATION_SEED: ${EMAIL_VERIFICATION_SEED}
      NTFY_ERROR_URL: ${NTFY_ERROR_URL}
      NTFY_WARNING_URL: ${NTFY_WARNING_URL}
      NTFY_SORT_URL: ${NTFY_SORT_URL}
      ERROR_SIGNAL_BACKEND: ${ERROR_SIGNAL_BACKEND:-mock}
      ERROR_SIGNAL_QUEUE_PATH: ${ERROR_SIGNAL_QUEUE_PATH:-/shared_cache/error_signals/pending}
      ERROR_SIGNAL_MOCK_PATH: ${ERROR_SIGNAL_MOCK_PATH:-/shared_cache/error_signals/mock.jsonl}
      APPLOG_FAKE: ${APPLOG_FAKE:-0}
      TOOLS_APPLOG_ID: ${TOOLS_APPLOG_ID}
      TOOLS_APPLOG_KEY: ${TOOLS_APPLOG_KEY}
      B2_ATTACHMENTS_BUCKETNAME: ${B2_ATTACHMENTS_BUCKETNAME}
      MAILGUN_MAX_RETRIES: ${MAILGUN_MAX_RETRIES}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_NEXT_RETRY_DELAY_EXPRESSION: ${MAILGUN_NEXT_RETRY_DELAY_EXPRESSION}
      UPLOAD_NEXT_RETRY_DELAY_EXPRESSION: ${UPLOAD_NEXT_RETRY_DELAY_EXPRESSION}
      UPLOAD_MAX_RETRIES: ${UPLOAD_MAX_RETRIES}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      DEFAULT_FROM_ADDRESS: ${DEFAULT_FROM_ADDRESS}
      APPLICATION_NAME: ${APPLICATION_NAME}
      SERVICE_NAME: migrate
      EDDIE_EMAIL: ${EDDIE_EMAIL}
      AUTO_APPROVE_AND_LOGIN_AFTER_REGISTRATION: ${AUTO_APPROVE_AND_LOGIN_AFTER_REGISTRATION:-0}
      ENTREE_FAKE: ${ENTREE_FAKE:-0}
      ENTREE_CLIENT_ENDPOINT: ${ENTREE_CLIENT_ENDPOINT}
      ENTREE_CLIENT_ID: ${ENTREE_CLIENT_ID}
      ENTREE_CLIENT_SECRET: ${ENTREE_CLIENT_SECRET}
      MIGRATIONS_FILE: /pythonpath/shared_code/migrations/migrations.py
      MIGRATE_SEED_BASE_URL: ${MIGRATE_SEED_BASE_URL}
      MIGRATE_SEED_BEARER_TOKEN: ${MIGRATE_SEED_BEARER_TOKEN}
      TESTING_SNAPSHOT_URL: ${TESTING_SNAPSHOT_URL}
      # sync:
      DELEN_SYNC_ENDPOINT: ${DELEN_SYNC_ENDPOINT}
      DELEN_SYNC_PLATFORM: ${DELEN_SYNC_PLATFORM}
      DELEN_SYNC_JWT: ${DELEN_SYNC_JWT}
      DELEN_SYNC_POLICY: ${DELEN_SYNC_POLICY:-full_history}
      # b2:
      B2_ATTACHMENTS_KEY: ${B2_ATTACHMENTS_KEY}
      B2_ATTACHMENTS_KEYID: ${B2_ATTACHMENTS_KEYID}
      B2_HASH_SALT: ${B2_HASH_SALT}
      # image storage:
      IMAGE_STORAGE_FAKE: ${IMAGE_STORAGE_FAKE:-1}
      IMAGE_STORAGE_HASH_SALT: ${IMAGE_STORAGE_HASH_SALT}
      IMAGE_STORAGE_MOCK_PATH: ${IMAGE_STORAGE_MOCK_PATH:-/shared_cache/image_uploads}
      IMAGE_STORAGE_ENDPOINT_URL: ${IMAGE_STORAGE_ENDPOINT_URL}
      IMAGE_STORAGE_BUCKET: ${IMAGE_STORAGE_BUCKET}
      IMAGE_STORAGE_ACCESS_KEY_ID: ${IMAGE_STORAGE_ACCESS_KEY_ID}
      IMAGE_STORAGE_SECRET_ACCESS_KEY: ${IMAGE_STORAGE_SECRET_ACCESS_KEY}
      IMAGE_STORAGE_PUBLIC_BASE_URL: ${IMAGE_STORAGE_PUBLIC_BASE_URL}
      CATALOG_REPORT_EMAIL: ${CATALOG_REPORT_EMAIL:-info@openkeuzecatalogus.nl}
      # mail:
      SMTP_FAKE: ${SMTP_FAKE:-1}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SENDER: ${SMTP_SENDER}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_TLS: ${SMTP_TLS}
      SMTP_SSL: ${SMTP_SSL}
      # AI:
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_HOST: ${AI_HOST}
      AI_API_KEY: ${AI_API_KEY}
      # testing:
      PYTEST_MOCK_EMAIL_DOMAIN: ${PYTEST_MOCK_EMAIL_DOMAIN}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - type: bind
        source: ./migrate/data
        target: /data
      - type: bind
        source: ./migrate/flags
        target: /flags
      - type: bind
        source: ./shared_code
        target: /pythonpath/shared_code
        read_only: true
      - type: bind
        source: ./shared_cache
        target: /shared_cache
      - type: bind
        source: ./shared_applog
        target: /shared_applog
      - type: bind
        source: ./shared_keys
        target: /shared_keys
    networks:
      - backend
    command: migrate
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"

  py4web:
    build:
      context: py4web
      args:
        PIP_INDEX_URL: https://devpi.edwh.nl/root/pypi/+simple/
    restart: unless-stopped
    depends_on:
      pg-0:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgq-applog:
        condition: service_healthy
      pgq-maintenance:
        condition: service_healthy
    stop_grace_period: 2s
    deploy:
      replicas: ${PY4WEB_REPLICAS:-3} # indien bjoern
    expose:
      - 8000
      - 7999
    <<: [*security-hardening, *memory-limit]
    environment:
      <<: *shared_environment
      PY4WEB_PASSWORD_FILE: /p4w/password.txt # to parameterize the _dashboard app
      PY4WEB_DASHBOARD_MODE: none
      PY4WEB_RESTART_SECRET: ${PY4WEB_RESTART_SECRET}
      PY4WEB_SESSION_SECRET: ${PY4WEB_SESSION_SECRET}
      PY4WEB_APPLOG_KEY: ${PY4WEB_APPLOG_KEY}
      PY4WEB_APPLOG_ID: ${PY4WEB_APPLOG_ID}
      PY4WEB_ERRORLOG: ":stderr"
      PY4WEB_DEBUG_MODE: ${PY4WEB_DEBUG_MODE:-0}
      REDASH_SECRET: ${REDASH_SECRET:-}
      DEBUG_PYCHARM_WITH_BJOERN: "nee"
      PY4WEB_SESSION_WL: ${PY4WEB_SESSION_WL}
      PY4WEB_SESSION_SYNC: ${PY4WEB_SESSION_SYNC}
      SIMPLE_ANALYTICS_URL: ${SIMPLE_ANALYTICS_URL:-https://inzichtin-delen.meteddie.nl}
      GRIST_API: ${GRIST_API}
      GRIST_HOST: ${GRIST_HOST}
      GRIST_DOCUMENT: ${GRIST_DOCUMENT}
      SERVICE_NAME: py4web
      COVERAGE_PROCESS_START: ${PY4WEB_COVERAGE_PROCESS_START:-}
      COVERAGE_FILE: ${PY4WEB_COVERAGE_FILE:-}
    command: python3 py4web_bjoern.py
    volumes:
      - type: bind
        source: ./migrate/data
        target: /data
        read_only: true
      - type: bind
        source: ./shared_code
        target: /pythonpath/shared_code
        read_only: true
      # - type: bind
      #   source: ./py4web/uploaded_attachments
      #   target: /p4w/apps/front_end/uploads
      - type: bind
        source: ./py4web/
        target: /p4w/
      - type: bind
        source: ./migrate/flags
        target: /flags
        read_only: true
      # - type: bind
      #   source: ./password.txt
      #   target: /p4w/password.txt
      - type: bind
        source: ./py4web/py4web_bjoern.py
        target: /p4w/py4web_bjoern.py
      - type: bind
        source: ./shared_cache
        target: /shared_cache
      - type: bind
        source: ./shared_applog
        target: /shared_applog
      - type: bind
        source: ./shared_keys
        target: /shared_keys
      - type: bind # voor bijv. uploads vanuit w2p -> p4w
        source: ./shared_user_storage
        target: /shared_user_storage
    networks:
      - broker
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.${PROJECT}-py4web-dev.loadbalancer.server.port=8000"
      - "traefik.http.routers.${PROJECT}-fragments-secure.tls=true"
      - "traefik.http.routers.${PROJECT}-fragments-secure.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.routers.${PROJECT}-fragments-secure.rule=Host(`fragments.${HOSTINGDOMAIN}`)"
      - "traefik.http.routers.${PROJECT}-fragments-secure.middlewares=strip-front-end-version, cors, www-redirect, edwh-std-security, regio-headers"
      - "traefik.http.routers.${PROJECT}-py4web-secure.tls=true"
      - "traefik.http.routers.${PROJECT}-py4web-secure.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.routers.${PROJECT}-py4web-secure.rule=Host(`${PY4WEB_SUBDOMAIN}.${HOSTINGDOMAIN}`) || Host(`www.${PY4WEB_SUBDOMAIN}.${HOSTINGDOMAIN}`) || Host(`${HOSTINGDOMAIN}`) || Host(`www.${HOSTINGDOMAIN}`)"
      - "traefik.http.routers.${PROJECT}-py4web-secure.middlewares=cors, www-redirect, edwh-std-security, regio-headers"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/healthcheck" ]
      interval: 1m30s
      timeout: 15s
      retries: 10
      start_period: 60s
      start_interval: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"

  pgq-scrapers: &pgq
    restart: unless-stopped
    build:
      context: pgq
    command: pgq run pgq.consumers.scrapers:main --batch-size 1
    # if you have small jobs, you can use a higher batch size (these will be processed by the same instance)
    # if you have slower jobs, batch size 1 helps with parallizing (at the cost of more overhead)
    networks:
      - backend
    <<: [*security-hardening, *memory-limit]
    environment:
      <<: *shared_environment
      SERVICE_NAME: pgq-scrapers
    depends_on:
      pg-0:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${PGQ_WORKERS:-3} # workers
    healthcheck:
      test: [ "CMD", "/opt/heartbeat.sh" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - type: bind
        source: ./pgq
        target: /pythonpath/pgq
        read_only: true
      - type: bind
        source: ./shared_code
        target: /pythonpath/shared_code
        read_only: true
      - type: bind
        source: ./shared_cache
        target: /shared_cache
      - type: bind
        source: ./shared_applog
        target: /shared_applog
      # py4web stages keuzecanvas HTML here and streams the rendered PDF back out of it
      # (same mount as the py4web service), so pgq-pdf needs it read-write
      - type: bind
        source: ./shared_user_storage
        target: /shared_user_storage

  pgq-scheduler:
    # this is the one that has `pgq.schedule`, the others just contain endpoints (except health-check).
    <<: *pgq
    command: pgq run pgq.consumers.scheduler:main --batch-size 1
    environment:
      <<: *shared_environment
      SERVICE_NAME: pgq-scheduler
    deploy:
      replicas: 1 # prevent double scheduling

  pgq-applog:
    <<: *pgq
    environment:
      <<: *shared_environment
      SERVICE_NAME: pgq-applog
    command: pgq run pgq.consumers.applog:main --batch-size 5
    deploy:
      replicas: ${PGQ_WORKERS:-3} # workers

  pgq-maintenance:
    <<: *pgq
    environment:
      <<: *shared_environment
      SERVICE_NAME: pgq-maintenance
    command: pgq run pgq.consumers.maintenance:main --batch-size 1
    deploy:
      replicas: ${PGQ_WORKERS:-3} # workers

  pgq-pdf:
    <<: *pgq
    build:
      context: pgq
      dockerfile: pdf.Dockerfile
      additional_contexts:
        pgq-base: service:pgq-scrapers
    environment:
      <<: *shared_environment
      SERVICE_NAME: pgq-pdf
    command: pgq run pgq.consumers.pdf:main --batch-size 1
    deploy:
      # note: different variable:
      replicas: ${PDF_WORKERS:-2} # workers

  load:
    image: locustio/locust:2.46.6
    user: "1050:1050"
    profiles:
      - load
    depends_on:
      py4web:
        condition: service_healthy
    <<: [*security-hardening, *memory-limit]
    working_dir: /mnt/locust
    volumes:
      - type: bind
        source: ./locust
        target: /mnt/locust
        read_only: true
      - type: bind
        source: ./shared_cache/load
        target: /reports
    networks:
      - backend
    restart: "no"

  playwright:
    profiles:
      - test
    build:
      context: ./playwright
    depends_on:
      py4web:
        condition: service_healthy
    <<: [*security-hardening, *memory-limit]
    environment:
      <<: *shared_environment
      SERVICE_NAME: playwright
      WEB_BASE_URL: ${WEB_BASE_URL:-http://py4web:8000}
    volumes:
      - type: bind
        source: ./playwright
        target: /work
      - type: bind
        source: ./shared_cache
        target: /shared_cache
      - type: bind
        source: ./shared_applog
        target: /shared_applog
    networks:
      - backend
    restart: "no"

  ######### redis ####################
  redis-master: # acts as master
    image: redis
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    <<: [*security-hardening, *memory-limit]
    networks:
      - backend
    user: "999:999"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run edwh setup to configure REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory "${REDIS_MAXMEMORY:-3gb}" --maxmemory-policy noeviction']
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"
    healthcheck: &redis-healthcheck
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1m30s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 10s

  redis-slave:
    <<: [*security-hardening, *memory-limit]
    restart: unless-stopped
    image: redis
    depends_on:
      - redis-master
    user: "999:999"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run edwh setup to configure REDIS_PASSWORD}
    command: ["sh", "-c", 'exec redis-server --replicaof redis-master 6379 --masterauth "$$REDISCLI_AUTH" --requirepass "$$REDISCLI_AUTH" --maxmemory "${REDIS_MAXMEMORY:-3gb}" --maxmemory-policy noeviction']
    healthcheck: *redis-healthcheck
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"

  ######### postgresql ###############
  pg-0: # Standalone PostgreSQL instance
    <<: [*security-hardening, *memory-limit]
    build:
      context: postgres
    restart: unless-stopped
    shm_size: '100MB'
    ports:
      - "${PGPOOL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./postgres/addendum.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
      - type: bind
        source: ./postgres/extensions.sql
        target: /docker-entrypoint-initdb.d/extensions.sql
        read_only: true
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_MAX_CONNECTIONS=200
    networks:
      backend:
        aliases:
          - postgres
          - pgpool
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"
    healthcheck:
      test: pg_isready --dbname=$POSTGRES_DATABASE --username=$POSTGRES_USERNAME -h pg-0
      interval: 1m30s
      timeout: 60s
      retries: 5
      start_period: 80s
      start_interval: 10s

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_NAME:-${PROJECT}_postgres_data}
