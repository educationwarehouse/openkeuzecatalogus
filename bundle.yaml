js: # to bundle.js
  - /* add required class to body */ document.body.classList.add("edwh-messagebus")
  - https://unpkg.com/hyperscript.org@0.9.4/dist/_hyperscript_w9y.min.js
  - https://unpkg.com/htmx.org@1.6.1
  - https://cdnjs.cloudflare.com/ajax/libs/ContentTools/1.6.16/content-tools.min.js
  - https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js
  # not using the .min because that breaks when minifying again:
  - https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.js
  - $in_app/assets/js/bootstrap-flash.js
css: # to bundle.css
  - https://cdnjs.cloudflare.com/ajax/libs/ContentTools/1.6.16/content-tools.min.css
  - https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css
  - $in_app/assets/css/app.scss

config:
  minify: 1
  hash: 1
  filename: bundled
  output_css: $out_app/static/css/$filename-$version.css
  output_js: $out_app/static/js/$filename-$version.js
  out_app: py4web/apps/_default
  in_app: py4web/apps/_default
