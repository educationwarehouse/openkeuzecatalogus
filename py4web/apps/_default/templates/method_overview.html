[[extend 'layout.html']]

<section class="mb-5">
    <div class="row g-4">
        <div class="col-lg-7">
            <span class="badge rounded-pill text-bg-warning-subtle text-warning-emphasis border border-warning-subtle mb-3">
                Leermethodes
            </span>
            <h1 class="display-5 fw-bold mb-3">Methodenoverzicht</h1>
            <edwh-editable id="method-overview-introduction">
                <p class="lead text-secondary mb-0">Bekijk methodes op onderwerp, onderwijslaag en beschikbare
                                                    ondersteuning.</p>
            </edwh-editable>
        </div>
        <div class="col-lg-5">
            <div class="card border-0 bg-body-tertiary shadow-sm">
                <div class="card-body p-4">
                    <p class="text-uppercase small fw-semibold text-secondary mb-2">Overzicht</p>
                    <edwh-editable id="method-overview-summary">
                        <p class="mb-0 text-secondary">
                            Verken methodes op onderwerp, onderwijslaag en beschikbare materialen.
                        </p>
                    </edwh-editable>
                </div>
            </div>
        </div>
    </div>
</section>

<aside class="comparison-tray shadow-lg" data-comparison-kind="methode" hidden>
    <div class="comparison-header">
        <span class="small text-uppercase fw-semibold">Selectie</span>
        <strong><span class="comparison-count">0</span> methodes</strong>
    </div>
    <ul class="comparison-items list-unstyled mb-3"></ul>
    <a class="btn btn-dark w-100 disabled comparison-link" aria-disabled="true">
        Vergelijk geselecteerde methodes
    </a>
</aside>

<section class="row g-4 align-items-start">
    <div class="col-12 col-lg-5 col-xxl-4">
        <div
                class="rounded-4 border border-warning-subtle bg-warning-subtle p-3"
                hx-get="[[=URL('htmx/methods/filters')]]"
                hx-trigger="load"
                hx-swap="innerHTML"
        >
            <div class="placeholder-glow">
                <span class="placeholder col-6 mb-3"></span>
                <span class="placeholder col-12 mb-2"></span>
                <span class="placeholder col-11 mb-2"></span>
                <span class="placeholder col-9"></span>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-7 col-xxl-8">
        <div
                id="method-results"
                class="rounded-4 border bg-body p-3 shadow-sm"
                hx-get="[[=URL('htmx/methods/results')]]"
                hx-include=".edwh-state"
                hx-trigger="ew:state_changed from:closest .edwh-messagebus"
                hx-swap="innerHTML"
        >
            <div class="placeholder-glow">
                <span class="placeholder col-4 mb-3"></span>
                <span class="placeholder col-12 mb-2"></span>
                <span class="placeholder col-12 mb-2"></span>
                <span class="placeholder col-8"></span>
            </div>
        </div>
    </div>
</section>
