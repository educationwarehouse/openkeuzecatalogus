<article class="okl-discussion__event-card" data-entry="[[=event.id]]"
         data-type="[[=event.source_type]]">
    <h3>
        <a class="okl-discussion__event-link" href="[[=event.url]]"
           target="_blank" rel="noopener noreferrer"
           data-entry="[[=event.id]]" data-type="[[=event.source_type]]"
           aria-label="Lees meer over [[=timeline.get('type_labels').get(event.source_type).lower()]]: [[=event.title]] ([[=event.author]], [[=event.event_date.strftime('%d-%m-%Y')]]); opent in nieuw tabblad">[[=event.title]]</a>
    </h3>
    <p>[[=event_summary(event)]]</p>
    <div class="okl-discussion__event-footer">
        <p>
            <strong>[[=event.author]]</strong>
            <span>[[=event.event_date.strftime('%d-%m-%Y')]]</span>
        </p>
        <span class="okl-discussion__event-badge" title="[[=timeline.get('type_labels').get(event.source_type)]]">
            <span class="okl-discussion__event-icon" aria-hidden="true"></span>
        </span>
    </div>
    <p class="okl-discussion__event-cue" aria-hidden="true">Lees verder</p>
</article>
