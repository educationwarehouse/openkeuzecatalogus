<div class="card border-warning-subtle shadow-sm">
    <div class="card-body p-4">
        <div class="mb-4">
            <p class="text-uppercase small fw-semibold text-secondary mb-2">Type leermiddelen</p>
            <nav
                    class="d-flex rounded-pill border p-1 bg-body-tertiary"
                    aria-label="Type leermiddelen"
            >
                <a
                        class="flex-fill rounded-pill px-3 py-2 text-center text-body text-decoration-none"
                        href="[[=URL('methodes')]]"
                >Methodes
                </a>
                <span
                        class="flex-fill rounded-pill px-3 py-2 text-center bg-body shadow-sm fw-semibold"
                        aria-current="page"
                >Producten</span>
            </nav>
        </div>

        <form class="vstack gap-3 edwh-state">
            <div class="mb-4">
                <label class="form-label fw-semibold" for="product-sort">Sorteren op</label>
                <select class="form-select" id="product-sort" name="sort">
                    [[for value, option in resolved_filters.sort_options.items():]]
                    <option value="[[=value]]">[[=option.label]]</option>
                    [[pass]]
                </select>
            </div>

            <div class="mb-4">
                <h2 class="h4 mb-1">Filter op producten</h2>
                <p class="text-secondary mb-0">Zoek en filter op openbare productgegevens.</p>
            </div>

            <input id="catalog-page" type="hidden" name="page" value="1">
            <input id="catalog-view" type="hidden" name="view" value="grid">
            [[for filter in resolved_filters.filters:]]
            [[=filter.render()]]
            [[pass]]
            <div class="d-grid d-sm-flex">
                <button class="btn btn-outline-dark" type="reset">Reset</button>
            </div>
        </form>
    </div>
</div>
