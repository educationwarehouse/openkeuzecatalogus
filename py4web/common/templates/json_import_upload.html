<div class="row">
    <div class="col-12 col-xl-8">
        <h3 class="mb-2">JSON import</h3>
        <p class="text-muted mb-4">Upload een JSON5-lijst of een object met één tabelnaam als sleutel.</p>
        <div class="border rounded-3 bg-light p-4">
            <form method="post" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="json-import-file" class="form-label fw-semibold">Importbestand</label>
                    <input type="file" id="json-import-file" name="json_file" accept="application/json,.json,.json5" required class="form-control">
                    <small class="text-muted d-block mt-2">JSON5 ondersteunt onder meer opmerkingen en afsluitende komma's.</small>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary">Valideren en voorbeeld tonen</button>
                    <a href="[[=template_url]]" class="btn btn-link text-decoration-none">Template downloaden (JSON5)</a>
                </div>
            </form>
        </div>
    </div>
</div>
