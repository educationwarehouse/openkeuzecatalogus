[build-system]
requires = [
    "hatchling",
    "hatch-requirements-txt",
]
build-backend = "hatchling.build"

[project]
name = "openkeuzecatalogus"
dynamic = [
    "version",
    "optional-dependencies",
]
description = 'Open Keuze Catalogus'
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE.txt" }

dependencies = [
    "edwh[server-plugins]>=1.12.0",
    "endow<2",
]

[tool.hatch.metadata.hooks.requirements_txt]
[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]


[project.urls]
Documentation = "https://github.com/educationwarehouse/openkeuzecatalogus#readme"
Issues = "https://github.com/educationwarehouse/openkeuzecatalogus/issues"
Source = "https://github.com/educationwarehouse/openkeuzecatalogus"

[tool.hatch.version]
path = "__init__.py"

[tool.setuptools]
packages = []

[tool.semantic_release]
branch = "openkeuzecatalogus/staging"
version_variable = "__init__.py:__version__"
change_log = "CHANGELOG.md"
upload_to_repository = false
upload_to_release = false
build_command = "hatch build"

[tool.hatch.build.targets.wheel]
packages = ["shared_code"]

[tool.typedal]
dialect = "postgres"
folder = "databases"
caching = false
pool_size = 1
migrate_table = "ewh_implemented_features"
flag_location = "/flags"
create_flag_location = true
schema = "public"
migrate = false  # disable pydal's automatic migration behavior
fake_migrate = false
# pydal2sql:
input = "shared_code/edwh/platform/data_model.py"
output = "shared_code/edwh/platform/migrations.py"
magic = true
function = "define_tables"

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "py4web/apps/_dashboard",
    "shared_code/generated",
    "shared_code/modules/scrapers/eduv/generated",
]

[tool.ruff.lint]
# Start strict-but-practical
exclude = [
    "shared_code/tests",
]
external = [
    "EW", # project-specific lint rules
]
select = [
    "ANN", # type annotations
    "C90", # complexity (mccabe)
    "D", # docstrings
    "E", # pycodestyle errors
    "F", # pyflakes
    "W", # pycodestyle warnings
    "I", # import sorting
    "B", # bugbear
    "UP", # pyupgrade
    "SIM", # simplify
    "C4", # comprehensions
    "PIE", # misc good practices
    "RUF", # Ruff-specific rules
    "S", # bandit security issues
]

ignore = [
    "ANN401", # sometimes Any is useful
    "D400", # docstring must end with a period
    "D401", # docstring must be imperative mood
    "D404", # docstring may not start with `This` ???
    "D203", # incompatible with D211; keep no-blank-line-before-class
    "D213", # incompatible with D212; keep multi-line-summary-first-line
    "RUF012", # typing.ClassVar often leads to other typing and runtime issues.
    "E711", # `== None` is allowed as pydal syntax
    "E712", # `== True` is allowed as pydal syntax
    "S101", # assert is useful for typing and testing reasons (like Rust 'expect')
]

[tool.ruff.lint.mccabe]
# default is 10
max-complexity = 9

[tool.ruff.lint.per-file-ignores]
"shared_code/tests/**" = ["ALL"]

[tool.pytest.ini_options]
timeout = "120"
timeout_method = "thread"
required_plugins = ["pytest-timeout"]
markers = [
    "accessibility: advisory axe-core accessibility scans",
]

[tool.ty.rules]
invalid-context-manager = "ignore" # ty claims our ViewMigrationManager doesn't implement __exit__ properly

[tool.ty.src]
exclude = [
    "py4web/apps/_dashboard",
    "venv",
    "shared_code/modules/scrapers/eduv/generated",
    "shared_code/tests",
    "**/tests/**",
    "**/test_*.py",
]
